version: 0.2

# The LET'S pipeline (aws-cicd) runs this from the repository root, as for max-core and inteli-tracker:
# build the package, upload it versioned, and hand template.yml plus the artifact parameters to
# CodePipeline, which deploys the one stack to dev and, after approval, to prod (ADR-0025).
# BUCKET_NAME comes from the pipeline and CICD_BUCKET_NAME from the CodeBuild project.
#
# Two packages travel: app.zip (the function, its migrations and the built panel) and
# jiraia-deps.zip (the dependency layer). Tests and gates run on every pull request (ci.yml) before
# anything reaches master, so they are not repeated here.
phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      # Pinned to packageManager in package.json: the build never picks up an unreviewed bun.
      - curl -fsSL https://bun.sh/install | bash -s "bun-v$(jq -r '.packageManager | sub("^bun@"; "")' package.json)"
      - export PATH="/root/.bun/bin:$PATH"
      - bun --version
  pre_build:
    commands:
      - export PATH="/root/.bun/bin:$PATH"
      - PROJECT_VERSION=$(jq -r .version package.json)
      - echo "Release version $PROJECT_VERSION"
      - PIPELINE=${CODEBUILD_INITIATOR#codepipeline/}
      - bun install --frozen-lockfile
  build:
    commands:
      - export PATH="/root/.bun/bin:$PATH"
      # The panel first: the function's package carries it (infra/build/package.ts).
      - bun run build
      - bun run build:layer
  post_build:
    commands:
      - aws s3 cp services/work/app.zip s3://$BUCKET_NAME/$PIPELINE/app.zip
      - aws s3 cp infra/layers/build/jiraia-deps.zip s3://$BUCKET_NAME/$PIPELINE/jiraia-deps.zip
      - aws s3api list-object-versions --bucket $BUCKET_NAME --prefix $PIPELINE/app.zip --max-items 1 > artifactVersion.json
      - aws s3api list-object-versions --bucket $BUCKET_NAME --prefix $PIPELINE/jiraia-deps.zip --max-items 1 > layerVersion.json
      - |
        cat > config.json <<-EOF
        {
          "Parameters": {
            "ArtifactBucket": "$BUCKET_NAME",
            "ArtifactPackage": "$PIPELINE/app.zip",
            "ArtifactPackageVersion": "$(jq -r .Versions[0].VersionId artifactVersion.json)",
            "LayerPackage": "$PIPELINE/jiraia-deps.zip",
            "LayerPackageVersion": "$(jq -r .Versions[0].VersionId layerVersion.json)"
          }
        }
        EOF
      - cat config.json
      # release-please creates the CHANGELOG on the first release; until then there is none to upload.
      - if [ -f CHANGELOG.md ]; then aws s3 cp CHANGELOG.md s3://$CICD_BUCKET_NAME/$PIPELINE-CHANGELOG.md; fi
      - CODEPIPE_EXECUTION_ID=$(aws codepipeline get-pipeline-state --name $PIPELINE --query 'stageStates[?actionStates[?latestExecution.externalExecutionId==`'${CODEBUILD_BUILD_ID}'`]].latestExecution.pipelineExecutionId')
      - if [ $(aws s3 ls s3://$CICD_BUCKET_NAME/release.log | wc -l) -eq 0 ]; then touch release.log; else aws s3 cp s3://$CICD_BUCKET_NAME/release.log release.log; fi
      - echo $CODEPIPE_EXECUTION_ID-$PIPELINE-$PROJECT_VERSION >> release.log
      - aws s3 cp release.log s3://$CICD_BUCKET_NAME/release.log
artifacts:
  type: zip
  files:
    - 'template.yml'
    - 'config.json'
